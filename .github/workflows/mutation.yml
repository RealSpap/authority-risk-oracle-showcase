name: Mutation

# Replays scripts/tests/mutations.json: breaks the code one way at a time and checks that the test suite notices.
# Weekly and by hand. Read-only: no key, no write. Red when a mutant survives (a gap in the tests), when a mutation no longer applies
# (the code it targets moved) or when a mutant does not run (it is never counted as caught). The report is the job summary.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # the run of 11 November (180 minutes) stopped with 270 of 429 mutants replayed, every one caught, each taking about 157 s: the whole suite (about 143 s on the runner) ran for every mutant. Now a mutant meets first the test modules that name its file, stopping at the first failure, and the whole suite only if they pass (a mutant is called survived only after the whole suite). On a laptop, not on the runner, the first 270 mutants took 10.5 s each on average where the whole suite took about 222 s; the 429 are estimated at 20 to 55 minutes at 4 workers on the runner, not measured there. The limit stays at 360 minutes, the longest GitHub allows a hosted job; the estimate grows with every mutation added, so a run that needs more than 330 minutes must be reduced, not given a longer limit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to its commit: a moved tag cannot change what runs here
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, pinned to its commit
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - run: pip install "PyYAML==6.0.2"   # scripts/tests/test_watch_cadence.py reads the workflow files with yaml.safe_load and the replay runs that suite; the Watch itself does not need it, so it is not in requirements.txt

      - name: The suite passes on the untouched tree, then every mutation is replayed on a copy
        run: python3 -u scripts/mutate.py --jobs 4 --markdown "$GITHUB_STEP_SUMMARY"
