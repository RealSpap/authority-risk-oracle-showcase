name: Publish authority-risk-mcp

# Manual only, from a tag. Run it from GitHub: Actions > Publish authority-risk-mcp > Run workflow > "Use workflow from" a TAG named mcp-v<version> (for example mcp-v0.1.0).
# There is no long-lived token anywhere: PyPI is published by trusted publishing and npm by trusted publishing (both exchange this run's identity for a short-lived token).
# Each publish job waits for a click on its environment ("pypi", "npm"), which the maintainer protects with a required reviewer. packages/authority-risk-mcp/PUBLISHING.md says what to set up once.
on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI"
        type: boolean
        default: true
      publish_npm:
        description: "Publish to npm"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/authority-risk-mcp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to its commit
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, pinned to its commit
        with:
          python-version: "3.11"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0, pinned to its commit
        with:
          node-version: "24"

      - name: The run is on a tag named mcp-v<version>, and both packages carry that version
        run: |
          set -eu
          v=$(python3 - <<'PY'
          import json, re
          py = re.search(r'^version = "([^"]+)"', open("pyproject.toml").read(), re.M).group(1)
          js = json.load(open("npm/package.json"))["version"]
          sj = json.load(open("server.json"))
          assert py == js == sj["version"] == sj["packages"][0]["version"] == sj["packages"][1]["version"], (py, js, sj["version"])
          print(py)
          PY
          )
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::run this workflow from a tag (Use workflow from: Tag), not from the branch $GITHUB_REF_NAME"; exit 1; }
          [ "$GITHUB_REF_NAME" = "mcp-v$v" ] || { echo "::error::the tag is $GITHUB_REF_NAME but the packages are version $v (expected mcp-v$v)"; exit 1; }
          echo "version=$v" >> "$GITHUB_ENV"

      - name: Tests (the signature check, the integrity cases, the protocol, the parity with the repository tools)
        run: |
          python3 build.py
          python3 -m unittest discover -s tests -v

      - name: Build the wheel and the source distribution, and the npm tarball
        run: |
          python3 -m pip install --quiet build twine
          python3 -m build --outdir dist
          python3 -m twine check dist/*
          python3 build.py --npm
          mkdir -p dist-npm
          (cd npm && npm pack --silent --pack-destination ../dist-npm)
          ls -l dist dist-npm

      - name: The built packages start, answer the four tools and refuse an altered folder (installed in throwaway environments)
        env:
          AUTHORITY_RISK_SLOW: "1"
        run: python3 -m unittest tests.test_install -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2, pinned to its commit
        with:
          name: pypi-dist
          path: packages/authority-risk-mcp/dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2, pinned to its commit
        with:
          name: npm-dist
          path: packages/authority-risk-mcp/dist-npm/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write   # the short-lived identity PyPI exchanges for an upload token (trusted publishing); no secret is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2, pinned to its commit
        with:
          name: pypi-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2, pinned to its commit
        with:
          packages-dir: dist/

  publish-npm:
    needs: build
    if: ${{ inputs.publish_npm }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write   # trusted publishing: npm exchanges this run's identity for a short-lived token, and records the provenance
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0, pinned to its commit
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2, pinned to its commit
        with:
          name: npm-dist
          path: dist-npm

      - name: npm 11.5.1 or newer is needed for trusted publishing
        run: |
          npm --version
          npm install --global npm@^11.5.1 --silent
          npm --version

      - name: Publish the tarball built above (provenance is recorded automatically for a public repository)
        run: npm publish dist-npm/authority-risk-mcp-*.tgz --access public
