name: Secret scan

on:
  push:
  pull_request:

# Reads the files of the repository and writes nothing.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to its commit, as in the other workflows
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, pinned to its commit, as in the other workflows
        with:
          python-version: "3.11"

      - name: Scan the tracked files for the shapes of secrets (scripts/scan_secrets.py; the names and private paths of the owner are not in this public file)
        run: python3 scripts/scan_secrets.py
