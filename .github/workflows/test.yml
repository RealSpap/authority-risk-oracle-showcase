name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Nothing in this workflow writes to the repository: the token gets read access to the contents and no more (30/10/2026).
permissions:
  contents: read

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # the job takes about 4 minutes: a hung step is cut instead of holding the runner for the 6 hour default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to its commit, as in the other workflows
        with:
          fetch-depth: 0   # a test reads the commit that added a file: with the default depth of 1 the one commit it sees is taken for the one that added everything

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, pinned to its commit, as in the other workflows
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - run: pip install "PyYAML==6.0.2"   # scripts/tests/test_watch_cadence.py reads the workflow files with yaml.safe_load; the Watch itself does not need it, so it is not in requirements.txt

      - name: Run scripts/lib/tests (pure logic, no live RPC)
        run: python3 -m unittest discover -s scripts/lib/tests -v

      - name: Run scripts/tests (update_scores.py's failure-alerting wrapper)
        run: python3 -m unittest discover -s scripts/tests -v

      # Wired in 2026-09-22: these chains/*/tests directories existed and were only ever run
      # manually per their own docstrings (see review of commit 585d949, reservation "ALL 15 NEW
      # TESTS ARE OUTSIDE CI") -- the genuinely valuable retry/divergence/wiring tests this pass
      # added under chains/ethereum-l1 and chains/tempo would have had nothing to notice a
      # regression. chains/base-ecosystem's pre-existing tests were in the same, silently-unrun
      # state; wired in for the same reason while touching this file.
      - name: Run chains/base-ecosystem/tests (pure logic, no live RPC)
        run: python3 -m unittest discover -s chains/base-ecosystem/tests -v

      - name: Run chains/ethereum-l1/tests (pure logic, no live RPC)
        run: python3 -m unittest discover -s chains/ethereum-l1/tests -v

      - name: Run chains/tempo/tests (pure logic, no live RPC)
        run: python3 -m unittest discover -s chains/tempo/tests -v

      - name: Run chains/hyperliquid/tests (pure logic, no live RPC)
        run: python3 -m unittest discover -s chains/hyperliquid/tests -v

  solidity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a normal run takes a few minutes: a hung download is cut instead of holding the runner for the 6 hour default
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to its commit, as in the other workflows

      # The download of Foundry sometimes fails on the network side (HTTP 504 during the download, seen from 04/11/2026 on): the failure is not in the tests.
      # The install is therefore tried twice. The first try may fail without failing the job; the second try runs only after a failure of the first and is the one that counts.
      # v1 and v1.9.2 are lightweight tags of the same commit (read on 2026-10-30 with `git ls-remote https://github.com/foundry-rs/foundry-toolchain refs/tags/v1 refs/tags/v1.9.2`, no peeled line): pinned to that commit, as in the other workflows
      - name: Install Foundry (first try)
        id: foundry_first_try
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf   # v1.9.2

      - name: Wait before the second try
        if: steps.foundry_first_try.outcome == 'failure'
        run: sleep 20

      - name: Install Foundry (second try, only if the first failed)
        if: steps.foundry_first_try.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf   # v1.9.2, same commit as the first try

      # Three tries; the step fails for real when the three fail. Each try starts from an empty lib/ target so that a half-downloaded copy cannot make the next try fail.
      - name: Install forge-std and OpenZeppelin (3 tries)
        run: |
          for i in 1 2 3; do
            rm -rf lib/forge-std lib/openzeppelin-contracts
            forge install foundry-rs/forge-std OpenZeppelin/openzeppelin-contracts --no-git && exit 0
            echo "forge install failed (try $i of 3)"
            sleep 20
          done
          exit 1

      - name: Run forge test
        run: forge test -vv
