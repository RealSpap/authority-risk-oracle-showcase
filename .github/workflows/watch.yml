name: Watch

# Reads every deployed oracle at each run (scheduled every 6 hours; a script outside GitHub may also start a run with the input relay=true), records what moved on the watch-data branch (cloned into watch/ for the run; main receives no commit from this job), and opens an issue labelled
# "alarm" when a score drops, a target turns stale or an oracle stops answering. Read-only: no key, no transaction.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      relay:
        description: "Set to true by a script that starts a run through the API (a trigger outside the GitHub schedule); a run started by hand leaves it false"
        type: string   # a string, not a boolean: gh workflow run -f relay=true sends text, and a string cannot be refused as the wrong type
        default: "false"

permissions:
  contents: write
  actions: read   # the list of runs of this workflow, read once to place the previous state in time (step "The last successful run")

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  guard:
    # Opening guard. A run that the SCHEDULE starts is cancelled here when another run of this workflow already served its slot, before the state is cloned, before anything is written: no commit on watch-data, nothing signed.
    # The slot of a run is the last instant not after its creation that matches the cron that started it (github.event.schedule, UTC; scripts/cron_slot.py). A run is cancelled when an EARLIER run of this workflow, not cancelled or skipped, was created from 5 minutes
    # before that slot (a script outside GitHub served it, or a late copy came first), or in the 45 minutes before this run (the first rule, kept). A run that FAILED in less than 10 minutes did not serve anything: the next run goes on.
    # It ends cancelled, never green: the step "The last successful run" below takes the newest SUCCESSFUL run as its anchor against a rollback of the state, and a green run that did nothing would become that anchor.
    # Any doubt (the list cannot be read, this run is not in it, the cron cannot be read, the cancel is refused) lets the run go on: a duplicate is harmless to the chain, a silent stop is not.
    # The slot rule cancels late copies that may be the only run for hours when no script outside GitHub covers the nights: the repository variable WATCH_GUARD_SLOT=off gives the 45-minute window back without a new commit.
    # Once the cancel is ACCEPTED the run does not go on: the output served makes the watch job skip, so a cancel that lands late never cuts a half-made run.
    # No code of the repository runs here (no checkout): the slot calculator below is written out by this job and a test checks that it is the very text of scripts/cron_slot.py.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # this job alone may cancel a run; the watch job keeps contents: write and actions: read; this one never checks the code out and could not push
    outputs:
      served: ${{ steps.guard.outputs.served }}   # "true" once the cancel of this run was accepted: the watch job does not start
    steps:
      - name: "Opening guard: a scheduled run whose slot was already served by another run of this workflow is cancelled before it touches anything"
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          GUARD_SLOT: ${{ vars.WATCH_GUARD_SLOT }}   # "off" (repository variable WATCH_GUARD_SLOT) turns the slot rule off and keeps the 45-minute window alone; anything else, or unset, leaves it on
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != schedule ]; then echo "started by $EVENT_NAME, not by the schedule: no check"; exit 0; fi
          T="${RUNNER_TEMP:-/tmp}"
          if ! gh api "repos/$REPO/actions/workflows/watch.yml/runs?per_page=30" > "$T/guard_runs.json" 2> "$T/guard_err.txt"; then
            echo "::warning title=Opening guard::the list of runs could not be read ($(head -c 120 "$T/guard_err.txt" | tr '\n' ' ')): this run goes on"; exit 0
          fi
          cat > "$T/cron_slot.py" <<'PY1'
          """Last slot of a cron expression, in UTC, with no dependency: the latest instant that is not after `now` and matches the cron.
          Usage: python3 -I cron_slot.py "<cron, 5 fields>" <epoch seconds>   prints the epoch of the last slot (exit 0); exit 1 and a message on stderr when the cron cannot be read or has no slot in 400 days.
          Fields: minute 0-59, hour 0-23, day of month 1-31, month 1-12, day of week 0-7 (0 and 7 are Sunday). Each field: `*`, a number, `a-b`, `*/n`, `a-b/n`, `a/n` (a up to the maximum), or a comma list of these.
          Like cron, when the day of month AND the day of week are both restricted, a day that fits either one is a slot. No names (MON, JAN), no @hourly, no `?`, `L`, `#`.
          Limit: it looks back at most 400 days (a yearly cron, or the 29th of February, may have no slot: an error, never an invented value)."""
          import datetime as dt, sys

          BOUNDS = [(0, 59), (0, 23), (1, 31), (1, 12), (0, 7)]
          MAX_DAYS = 400


          def field(text, lo, hi):
              """-> (set of values, wildcard). Raises ValueError when the field cannot be read or is out of bounds."""
              if not isinstance(text, str) or text == "": raise ValueError("empty field")
              out = set(); wild = text == "*"
              for part in text.split(","):
                  if part == "": raise ValueError("empty element in a list")
                  span, _, step = part.partition("/")
                  if "/" in part and not step.isdigit(): raise ValueError("unreadable step: %r" % part)
                  p = int(step) if "/" in part else 1
                  if p < 1: raise ValueError("zero step: %r" % part)
                  if span == "*": a, b = lo, hi
                  elif "-" in span:
                      x, _, y = span.partition("-")
                      if not (x.isdigit() and y.isdigit()): raise ValueError("unreadable range: %r" % part)
                      a, b = int(x), int(y)
                  elif span.isdigit(): a = int(span); b = hi if "/" in part else a
                  else: raise ValueError("unreadable element: %r" % part)
                  if a < lo or b > hi or a > b: raise ValueError("out of bounds or reversed: %r (%d to %d allowed)" % (part, lo, hi))
                  out.update(range(a, b + 1, p))
              return out, wild


          def parse(cron):
              f = cron.split() if isinstance(cron, str) else []
              if len(f) != 5: raise ValueError("a cron with 5 fields is expected: %r" % (cron,))
              (M, _), (H, _), (DM, dm_wild), (MO, _), (DW, dw_wild) = (field(f[i], *BOUNDS[i]) for i in range(5))
              DW = {0 if d == 7 else d for d in DW}
              return M, H, DM, dm_wild, MO, DW, dw_wild


          def day_fits(day, DM, dm_wild, MO, DW, dw_wild):
              if day.month not in MO: return False
              wd = (day.weekday() + 1) % 7           # Monday=1 ... Sunday=0
              if dm_wild and dw_wild: return True
              if not dm_wild and not dw_wild: return day.day in DM or wd in DW
              return (day.day in DM) if not dm_wild else (wd in DW)


          def last_slot(cron, now):
              """Epoch (UTC) of the last slot not after `now` (epoch); ValueError when the cron cannot be read or has no slot in 400 days."""
              M, H, DM, dm_wild, MO, DW, dw_wild = parse(cron)
              t = dt.datetime.fromtimestamp(int(now), dt.timezone.utc).replace(second=0, microsecond=0)
              for k in range(MAX_DAYS + 1):
                  day = (t - dt.timedelta(days=k)).replace(hour=0, minute=0)
                  if not day_fits(day, DM, dm_wild, MO, DW, dw_wild): continue
                  limit = (t.hour, t.minute) if k == 0 else (23, 59)
                  for h in sorted(H, reverse=True):
                      for m in sorted(M, reverse=True):
                          if (h, m) <= limit: return int(day.replace(hour=h, minute=m).timestamp())
              raise ValueError("no slot in %d days for %r" % (MAX_DAYS, cron))


          if __name__ == "__main__":
              if len(sys.argv) != 3: sys.exit('usage: cron_slot.py "<cron>" <epoch>')
              try: print(last_slot(sys.argv[1], sys.argv[2]))
              except (ValueError, OverflowError, OSError) as e: sys.stderr.write("cron unreadable: %s\n" % e); sys.exit(1)
          PY1
          cat > "$T/guard.py" <<'PY2'
          import datetime, json, os, sys
          import cron_slot
          EARLY = 10 * 60    # a run that failed in less than this did not serve its slot
          WINDOW = 45 * 60   # first rule, kept: any run created in the 45 minutes before this one
          BEFORE = 5 * 60    # slot rule: any run created from 5 minutes before the slot of this one
          SLOT = os.environ.get("GUARD_SLOT", "") != "off"
          def t(s): return datetime.datetime.strptime(s, "%Y-%m-%dT%H:%M:%SZ").replace(tzinfo=datetime.timezone.utc).timestamp()
          def counts(r):
              c = r.get("conclusion")
              if c in ("cancelled", "skipped"): return False   # a run that was cancelled or skipped served nothing
              if c in ("failure", "startup_failure"):          # a failure counts only when it ran 10 minutes or more
                  try: return t(r["updated_at"]) - t(r["run_started_at"]) >= EARLY
                  except Exception: return False               # a duration that cannot be read does not count: this run goes on
              return True                                       # success, timed out, running, queued, waiting, pending, anything else
          try:
              runs = json.load(open(sys.argv[1]))["workflow_runs"]; me = int(sys.argv[2])
              mine = [r for r in runs if r["id"] == me]
              if not mine: print("unread: this run is not in the list"); sys.exit(0)
              t0 = t(mine[0]["created_at"]); slot = cron_slot.last_slot(sys.argv[3], t0) if SLOT else 0
              for r in runs:
                  if r["id"] == me or not counts(r): continue
                  t1 = t(r["created_at"])
                  if (t1, r["id"]) >= (t0, me): continue       # only an EARLIER run counts: two runs never cancel each other
                  rule = "slot" if SLOT and t1 >= slot - BEFORE else "window" if t0 - t1 <= WINDOW else ""
                  if rule: print("served %d %d %s" % (r["id"], (t0 - t1) // 60, rule)); sys.exit(0)
              print("go")
          except Exception as e: print("unread: %s" % str(e)[:100])
          PY2
          v=$(python3 "$T/guard.py" "$T/guard_runs.json" "$RUN_ID" "$SCHEDULE" 2>&1) || v="unread: the check itself failed"
          case "$v" in
            served*)
              read -r _ rid age rule <<< "$v"
              echo "::notice title=Slot already served::run $rid of this workflow was created $age minutes before this one ($rule rule): this run is cancelled, nothing is cloned, signed or recorded"
              if gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" > /dev/null 2> "$T/guard_err.txt"; then
                echo "served=true" >> "$GITHUB_OUTPUT"   # written as soon as the cancel is accepted: from here the watch job never starts, whatever the delay of the cancel
                sleep 120   # the cancel reaches this job within seconds; the run ends cancelled
                echo "::error title=Opening guard::the cancel was accepted but had not been applied after 2 minutes: the watch job is skipped and this run ends red; nothing was cloned, signed or recorded"; exit 1
              else echo "::warning title=Opening guard::the cancel request was refused ($(head -c 120 "$T/guard_err.txt" | tr '\n' ' ')): this run goes on"; fi ;;
            go) echo "no other run of this workflow served the slot of this one" ;;
            *) echo "::warning title=Opening guard::the check could not be completed ($v): this run goes on" ;;
          esac

  watch:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.served != 'true' }}   # a cancel of the guard cancels the whole run, so this job never starts after it, and a cancel that was accepted but lands late never cuts a half-made run (served); a guard that CRASHED (result failure, no output) does not stop the Watch
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0, pinned to its commit: a moved tag cannot change what runs here
        with:
          persist-credentials: false   # the write token is handed to the push step only, never to pip or the scripts
          ref: main   # the code and the documents come from main; the state of the Watch comes from the watch-data branch (next step), read when the run starts, so a run queued behind another one starts from the latest state

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0, pinned to its commit
        with:
          python-version: "3.11"

      - run: pip install -r scripts/requirements.txt

      - name: "The state of the Watch lives on the watch-data branch: clone it into watch/ (a fork gets the branch created empty; the canonical repository refuses a cold start, which would break the chain of events)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCH_REMOTE: https://github.com/${{ github.repository }}.git
          WATCH_REQUIRE_SEED: ${{ github.repository == 'RealSpap/authority-risk-oracle-showcase' && '1' || '' }}
        run: bash scripts/watch_branch.sh prepare

      - name: "The last successful run of this workflow (GitHub's own list of runs): the one record an older signed state put back on watch-data cannot rewrite"
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}   # this step only: the scripts of the next step never see a token
        run: |
          t=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || true)
          case "$t" in
            20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z) echo "utc=$t" >> "$GITHUB_OUTPUT"; echo "the last successful run started $t" ;;
            *) echo "::warning title=Rollback check::the list of runs could not be read (or holds no successful run yet): an older state put back on watch-data is not looked for in this run" ;;
          esac

      - name: Read every EVM oracle and diff against the previous run
        id: run
        env:
          HAS_SIGNING_KEY: ${{ secrets.WATCH_SIGNING_KEY != '' }}   # whether a key exists, never the key: an unsigned previous run is then refused
          WATCH_RELAY: ${{ inputs.relay }}   # "true" when a script started this run through the API: a run nobody started by hand never takes the WATCH_BOOTSTRAP switch (scripts/check_previous_state.py)
          WATCH_BOOTSTRAP: ${{ vars.WATCH_BOOTSTRAP }}   # "1" only for the first signed run, started by hand (workflow_dispatch), set by the owner as a repository variable and removed after it; a scheduled run ignores it (scripts/check_previous_state.py)
          WATCH_LAST_SUCCESS_UTC: ${{ steps.anchor.outputs.utc }}   # empty when the list of runs could not be read
        run: |
          set +e
          python3 scripts/check_previous_state.py --watch watch > watch/previous_state.txt 2>&1; p=$?   # before the run extends the files and signs them again: a change pushed between two runs must not be signed by the next one
          cat watch/previous_state.txt; grep '^ALARM' watch/previous_state.txt > watch/run.log   # the alarm gate reads the ALARM lines of run.log
          if grep -q '^ALARM' watch/previous_state.txt; then echo "prev_alarm=1" >> "$GITHUB_OUTPUT"; fi   # the switch used or left on, a refusal: an issue every time, whatever the gate remembers
          if [ "$p" != 0 ]; then
            echo "code=2" >> "$GITHUB_OUTPUT"
            if [ "$p" = 3 ]; then echo "::error title=Previous state not checked::PyNaCl is not installed, so the signature of the state this run starts from could not be checked (pip install pynacl). This says nothing about the state; the run does not continue"
            else echo "::error title=Previous state::the state this run starts from is not the one the previous run signed (a file changed, added or removed, the event log cut, signature.json gone, or an older state put back): this run does not continue it"; fi
            { printf '# Alarm, %s\n\nThe Watch did not run: the state it starts from was refused. Nothing was recorded.\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat watch/previous_state.txt; } > watch/alarm.md
            exit 1
          fi
          head=$(python3 -c "import json;print(((json.load(open('watch/signature.json')) or {}).get('manifest') or {}).get('events_chain_head') or '')" 2>/dev/null || true)
          if [ -n "$head" ]; then python3 scripts/verify_chain.py --events watch/events.jsonl --head "$head" || { echo "code=2" >> "$GITHUB_OUTPUT"; echo "prev_alarm=1" >> "$GITHUB_OUTPUT"; echo "ALARM previous state refused: the event log no longer ends at the signed head" >> watch/run.log; echo "::error title=Journal head::the event log no longer ends where the signed manifest of the previous run says it ends (or is gone): this run does not continue it"; exit 1; }; else echo "no pinned head in the previous manifest (first run, or an unsigned one): nothing to compare"; fi
          python3 scripts/watch_run.py 2>&1 | tee watch/run.log   # 2>&1: a crash prints its Traceback on stderr; without it run.log never held one, so a crash (exit 1) read as 'something unread', a warning, and the job stayed green (review 11/10)
          c=${PIPESTATUS[0]}; echo "code=$c" >> "$GITHUB_OUTPUT"
          grep '^ALARM' watch/previous_state.txt >> watch/run.log   # the lines of the check that came before the run (the bootstrap switch used or left on): the alarm gate reads the ALARM lines of run.log
          if [ "$c" = 1 ] && ! grep -q Traceback watch/run.log; then echo "a target or an oracle was not read this run (exit 1), a warning shown on the page, not a failure" > watch/run.txt; elif [ "$c" != 0 ] && [ "$c" != 2 ]; then echo "exit code $c" > watch/run.txt; fi   # 2 = an alarm, 1 without a traceback = something unread, both known states

      - name: Which oracle turns stale, and when (EVM, Solana)
        run: |
          set +e
          # One retry, this step only. Not in plan 12.4 (its row 1 asks to read the cause of the failures before any correction): added by the work order of 12 Nov. Why this step: it is the one RPC read that writes nothing but its own log (eth_call and getAccountInfo, no state of the Watch, no file read back by a later step), so a second pass cannot double-write anything. Never copy this to a step that writes state (watch_run.py, second_opinion.py, pause_state.py, the record step, an issue).
          # The second pass runs only when the first one could not READ an oracle (UNREADABLE) or crashed (Traceback); a stale oracle (exit 1 without those words) is a known state and is not read twice.
          python3 scripts/oracle_freshness.py --warn-hours 48 > watch/freshness.txt 2>&1; c=$?
          if [ "$c" != 0 ] && grep -qE 'UNREADABLE|Traceback' watch/freshness.txt; then echo "::notice title=Freshness read::an oracle could not be read, one more read in 30 seconds"; sleep 30; python3 scripts/oracle_freshness.py --warn-hours 48 > watch/freshness.txt 2>&1; c=$?; fi
          if [ "$c" != 0 ]; then if grep -q Traceback watch/freshness.txt; then echo "exit code $c" >> watch/freshness.txt; else echo "stale or unreadable oracle (exit $c): a warning, not a failure; the dashboard shows it, the digest lists it" >> watch/freshness.txt; fi; fi   # a stale oracle is a known state shown on the page, not a red job

      - name: What is queued behind the watched timelocks, and what just went through
        run: timeout 15m python3 scripts/check_pending_ops.py --days 90 --recent-days 14 --out watch/pending_ops.json > watch/pending_ops.txt 2>&1 || { c=$?; if [ "$c" = 124 ]; then echo "timed out at the step limit (124), previous file kept, a warning" >> watch/pending_ops.txt; else echo "exit code $c" >> watch/pending_ops.txt; fi; }

      - name: How much money sits behind each setup (DefiLlama TVL, matched by hand in scripts/tvl_match.py)
        run: timeout 5m python3 scripts/tvl_match.py --out watch/tvl.json > watch/tvl.txt 2>&1 || { c=$?; if [ "$c" = 124 ]; then echo "timed out at the step limit (124), previous file kept, a warning" >> watch/tvl.txt; else echo "exit code $c" >> watch/tvl.txt; fi; }

      - name: "What each contract holds by its own account (ERC-4626 totalAssets() priced by DefiLlama's coin API): the attacker's question uses it before the protocol TVL"
        run: timeout 5m python3 scripts/held_assets.py --scores watch/scores --out watch/held_assets.json > watch/held_assets.txt 2>&1 || echo "exit code $?" >> watch/held_assets.txt

      - name: "Is the contract paused, and did that change since the previous run (paused() / isPaused()): a flip to paused fires a high alert"
        run: timeout 5m python3 scripts/pause_state.py --scores watch/scores --out watch/pause_state.json > watch/pause_state.txt 2>&1 || echo "exit code $?" >> watch/pause_state.txt

      - name: "The other hands on a contract (curator, guardian, pauser): who holds each and whether one changed hands since the previous run"
        run: timeout 10m python3 scripts/side_roles.py --scores watch/scores --out watch/side_roles.json > watch/side_roles.txt 2>&1 || { c=$?; if [ "$c" = 124 ]; then echo "timed out at the step limit (124), previous file kept, a warning" >> watch/side_roles.txt; echo "::warning title=side_roles timed out::the secondary-roles step hit its 10 minute limit; the previous watch/side_roles.json is kept"; else echo "exit code $c" >> watch/side_roles.txt; fi; }

      - name: The paper trail of every target (which dated documents mention its address)
        run: python3 scripts/paper_trail.py --out watch/paper_trail.json > watch/paper_trail.txt 2>&1 || echo "exit code $?" >> watch/paper_trail.txt

      - name: "The queues of the timelocks the independent reader found (previous run's second_opinion.json), on every chain: merged into pending_ops.json as discovered"
        run: timeout 15m python3 scripts/pending_ops_discovered.py --so watch/second_opinion.json --pending watch/pending_ops.json --days 14 > watch/pending_discovered.txt 2>&1 || { c=$?; if [ "$c" = 124 ]; then echo "timed out at the step limit (124), the watchlist queues are kept and the discovered ones wait for the next run" >> watch/pending_discovered.txt; else echo "exit code $c" >> watch/pending_discovered.txt; fi; }

      - name: The timelock queue as a calendar feed (.ics)
        run: python3 scripts/pending_ics.py --pending watch/pending_ops.json --out watch/pending_ops.ics > watch/pending_ics.txt 2>&1 || echo "exit code $?" >> watch/pending_ics.txt

      - name: "A second opinion on every admin-key score: an independent reader on the target's real chain (EIP-1967 admin, owner(), admin(), then EOA / Safe / timelock) against the published score"
        id: so
        run: |
          python3 scripts/second_opinion.py --scores watch/scores --out watch/second_opinion.json --md watch/second_opinion.md > watch/second_opinion.txt 2>&1 || echo "exit code $?" >> watch/second_opinion.txt
          cat watch/second_opinion.txt
          echo "disagree=$(python3 -c "import json;print(int(json.load(open('watch/second_opinion.json')).get('disagree',0)))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"   # int(): the value comes from a file that may be the previous run's, and a text with a line break would write other step outputs
          echo "upgraded=$(python3 -c "import json;print(len(json.load(open('watch/second_opinion.json')).get('upgrades',[])))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: "Did a Safe that governs tracked contracts wake up: its nonce, how long it was observed idle, and a move after 14 days or more"
        run: timeout 5m python3 scripts/safe_activity.py --second-opinion watch/second_opinion.json --out watch/safe_activity.json > watch/safe_activity.txt 2>&1 || echo "exit code $?" >> watch/safe_activity.txt

      - name: "Who holds the admin role of a contract whose role holders cannot be listed: hasRole(DEFAULT_ADMIN_ROLE) for the Safes and timelocks the reader already knows"
        run: timeout 5m python3 scripts/admin_probe.py --second-opinion watch/second_opinion.json --out watch/admin_probe.json > watch/admin_probe.txt 2>&1 || echo "exit code $?" >> watch/admin_probe.txt

      - name: "Is the code behind each proxy readable: Sourcify verified source for every implementation the reader found"
        run: timeout 10m python3 scripts/impl_sources.py --so watch/second_opinion.json --out watch/impl_sources.json > watch/impl_sources.txt 2>&1 || echo "exit code $?" >> watch/impl_sources.txt

      - name: "Squads proposal queues (Solana): the proposals of every multisig the independent reader resolved, merged into pending_ops.json"
        run: timeout 10m python3 scripts/squads_proposals.py --so watch/second_opinion.json --pending watch/pending_ops.json --recent-days 14 > watch/squads_proposals.txt 2>&1 || echo "exit code $?" >> watch/squads_proposals.txt

      - name: "Some entries are not shown in the public view: they are taken out of pending_ops.json before any file is written from it. The list is the secret WATCH_WITHHOLD and is never printed; without it the Watch publishes as before and the private alarm says so"
        id: withhold
        env:
          WATCH_WITHHOLD: ${{ secrets.WATCH_WITHHOLD }}
          WATCH_WITHHOLD_REQUIRED: ${{ github.repository == 'RealSpap/authority-risk-oracle-showcase' && '1' || '' }}   # only the canonical repository expects the list: a fork without it says nothing
          WATCH_WITHHOLD_PRIVATE: ${{ runner.temp }}/held_queue.json   # the full records, for the private watch: a runner file, never under watch/; the later steps and the record read it from the runner's temp folder
        run: python3 scripts/withhold.py retain --watch watch > /dev/null 2>&1   # a crash with a list present fails the job (nothing is recorded)

      - name: "What is not shown, for the private watch only: a comment on a private issue when it changed (nothing without ISSUES_TOKEN, nothing printed)"
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          PRIVATE_REPO: RealSpap/authority-risk-oracle
        run: |
          f="$RUNNER_TEMP/held_queue.json"
          [ -n "$GH_TOKEN" ] && [ -s "$f" ] && [ "$(wc -c < "$f")" -gt 4 ] || exit 0
          h=$(sha256sum "$f" | cut -c1-16)
          n=$(gh issue list --repo "$PRIVATE_REPO" --label held-queue --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$n" ]; then last=$(gh issue view "$n" --repo "$PRIVATE_REPO" --json comments --jq '.comments[-1].body // ""' 2>/dev/null | head -1 || true); [ "$last" = "held-queue sha256:$h" ] && exit 0; fi
          { printf 'held-queue sha256:%s\n\n```json\n' "$h"; head -c 60000 "$f"; printf '\n```\n'; } > "$RUNNER_TEMP/held_comment.md"
          if [ -z "$n" ]; then
            gh label create held-queue --repo "$PRIVATE_REPO" --color 5319E7 --description "Entries left out of the public view (private)" > /dev/null 2>&1 || true
            gh issue create --repo "$PRIVATE_REPO" --title "Entries not shown in the public view (private)" --label held-queue --body-file "$RUNNER_TEMP/held_comment.md" > /dev/null 2>&1 || true
          else
            gh issue comment "$n" --repo "$PRIVATE_REPO" --body-file "$RUNNER_TEMP/held_comment.md" > /dev/null 2>&1 || true
          fi

      - name: "What each EVM timelock operation is (upgrade, authority change, pause, nested timelock, cross-chain message, parameter): named and classified"
        run: python3 scripts/classify_ops.py --pending watch/pending_ops.json --cache watch/selectors.json > watch/classify_ops.txt 2>&1 || echo "exit code $?" >> watch/classify_ops.txt

      - name: "The same protocol on several chains, hand by hand (DefiLlama grouping, independent reads): weakest deployment named"
        run: python3 scripts/cross_chain.py --watch watch --data data --out watch/cross_chain.json > watch/cross_chain.txt 2>&1 || echo "exit code $?" >> watch/cross_chain.txt

      - name: "Money at risk by cause (plain key, keys-only multisig, no delay, unverified code, one lost key, upgrade executable, transfer in flight, Safe module), from the run's own files"
        run: python3 scripts/risk_by_cause.py --watch watch --data data --out watch/risk_by_cause.json > watch/risk_by_cause.txt 2>&1 || echo "exit code $?" >> watch/risk_by_cause.txt

      - name: One share card per target (PNG for link previews), rewritten only when it changes; after the money-at-risk step, whose copy of data/tvl_scope.json it reads (before, a hand edit reached the cards one run late)
        run: timeout 10m python3 scripts/og_cards.py --scores watch/scores --tvl watch/tvl.json --latest watch/latest.json --out watch/og > watch/og.txt 2>&1 || { c=$?; if [ "$c" = 124 ]; then echo "timed out at the step limit (124), previous file kept, a warning" >> watch/og.txt; else echo "exit code $c" >> watch/og.txt; fi; }

      - name: "Public disputes: data/disputes.json checked against the tracked set, every opening and resolution into the chained log"
        run: python3 scripts/disputes.py --registry data/disputes.json --scores watch/scores --out watch/disputes.json --events watch/events.jsonl > watch/disputes.txt 2>&1 || echo "exit code $?" >> watch/disputes.txt

      - name: "Score series and calibration: every composite over time from the chained log, and the observed authority actions against the score at the time"
        run: python3 scripts/score_series.py --scores watch/scores --events watch/events.jsonl --pending watch/pending_ops.json --out watch/score_series.json > watch/score_series.txt 2>&1 || echo "exit code $?" >> watch/score_series.txt

      - name: Evaluate rules.json (alerts page; Telegram and Discord only if the secrets are set)
        id: rules
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_MODE: ${{ vars.TELEGRAM_MODE }}   # empty = today's behaviour; "daily" = the public channel gets one summary a day (set by the owner, a repository variable)
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
        run: |
          python3 scripts/evaluate_rules.py --rules rules.json --scores watch/scores --latest watch/latest.json --tvl watch/tvl.json --pending watch/pending_ops.json --prev watch/prev --out watch/alerts.json > watch/alerts.txt 2>&1 || echo "exit code $?" >> watch/alerts.txt
          echo "hi_new=$(python3 -c "import json;print(sum(1 for x in json.load(open('watch/alerts.json')).get('active',[]) if x['severity']=='high' and x['new']))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

      - name: "The event log is hash-chained (every line commits to the previous one): verify the whole chain, then the methodology registry and one Atom feed per contract"
        id: meth
        run: |
          python3 scripts/verify_chain.py --events watch/events.jsonl --json watch/chain.json > watch/chain.txt 2>&1 || { c=$?; cat watch/chain.txt; [ "$c" = 2 ] || { echo "::error::the event log's hash chain is broken: a line was edited, removed or inserted"; exit 1; }; }
          python3 scripts/methodology_check.py --scores watch/scores --prev watch/prev --events watch/events.jsonl --out watch/methodology.json --md watch/methodology.md > watch/methodology.txt 2>&1 || echo "exit code $?" >> watch/methodology.txt   # before explain_moves refreshes watch/prev
          echo "changed=$(python3 -c "import json;print(len(json.load(open('watch/methodology.json')).get('changes',[])))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          python3 scripts/feeds_per_target.py --scores watch/scores --events watch/events.jsonl --alerts watch/alerts.json --pending watch/pending_ops.json --out watch/feed > watch/feeds.txt 2>&1 || echo "exit code $?" >> watch/feeds.txt
          python3 scripts/badges_protocol.py --watch watch --out watch/badge/protocol >> watch/feeds.txt 2>&1 || echo "exit code $?" >> watch/feeds.txt   # one shields.io badge per protocol (its weakest tracked deployment), for a protocol's own README
          python3 scripts/watch_run.py --feed-only >> watch/feeds.txt 2>&1 || echo "exit code $?" >> watch/feeds.txt   # the global feed.xml again, now with the independent reader's findings

      - name: Why each score moved (five sub-scores against the previous run) and the requirement badges
        run: |
          python3 scripts/explain_moves.py --scores watch/scores --prev watch/prev --out watch/moves.json > watch/moves.txt 2>&1 || echo "exit code $?" >> watch/moves.txt
          python3 scripts/badges_req.py --scores watch/scores --out watch/badge >> watch/moves.txt 2>&1 || echo "exit code $?" >> watch/moves.txt

      - name: "How many keys sit on several protocols (the index itself stays out of the repository: it is a targeting map)"
        run: |
          timeout 15m python3 scripts/who_controls.py --top 20 --write-index "$RUNNER_TEMP/who_controls.json" > "$RUNNER_TEMP/who_controls.txt" 2>&1 || { c=$?; echo "exit code $c" >> "$RUNNER_TEMP/who_controls.txt"; if [ "$c" = 124 ]; then echo "who_controls timed out at the step limit (124), no signer index this run, every watch file is redacted by the contract whitelist alone (a warning)" >> watch/keys.txt; else echo "who_controls exit code $c (no signer index this run, every watch file is redacted by the contract whitelist alone)" >> watch/keys.txt; fi; }
          python3 scripts/keys_summary.py --index "$RUNNER_TEMP/who_controls.json" --out watch/keys_summary.json >> watch/keys.txt 2>&1 || echo "exit code $?" >> watch/keys.txt
          rm -f watch/who_controls.json

      - name: Safe signer, threshold, module and guard changes over the last 7 days
        run: timeout 20m python3 scripts/check_safe_changes.py --days 7 --out watch/safe_changes.json > watch/safe_changes.log 2>&1 || { c=$?; if [ "$c" = 124 ]; then echo "timed out at the step limit (124), previous file kept, a warning" >> watch/safe_changes.log; else echo "exit code $c" >> watch/safe_changes.log; fi; }

      - name: "Coverage per chain: what this watch sees and does not see (independent read, proxies, Safe modules, timelock queues, Safe events, TVL), from the files of this run"
        run: python3 scripts/coverage.py --watch watch --out watch/coverage.json > watch/coverage.txt 2>&1 || echo "exit code $?" >> watch/coverage.txt

      - name: "Review queue: everything a person must look at, from the files of this run, ranked, minus what was already reviewed; a priority-1 item older than 2 days re-enters the alarm"
        id: rq
        run: |
          python3 scripts/review_queue.py --watch watch --data data --out watch/review_queue.json --md watch/review_queue.md > watch/review_queue.txt 2>&1 || echo "exit code $?" >> watch/review_queue.txt
          echo "overdue=$(python3 -c "import json;print(int(json.load(open('watch/review_queue.json')).get('overdue',0)))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"   # int(): see above

      - name: "Trend: one line per run with the numbers measured, so the next runs can say whether the tracked set improves"
        run: python3 scripts/trend.py --watch watch --out watch/trend.jsonl > watch/trend.txt 2>&1 || echo "exit code $?" >> watch/trend.txt

      - name: "Warning ledger: for every queued operation, the run that first saw it, the notice that gave, and the ones that went through between two runs (watch/warning_ledger.json)"
        run: python3 scripts/warning_ledger.py --watch watch --out watch/warning_ledger.json > watch/warning_ledger.txt 2>&1 || echo "exit code $?" >> watch/warning_ledger.txt

      - name: Shorten every root-signer address in what leaves with the run (the index itself stays in the runner)
        run: python3 scripts/redact_signers.py --index "$RUNNER_TEMP/who_controls.json" --scores watch/scores watch/second_opinion.json watch/second_opinion.md watch/digest.md watch/safe_changes.json watch/pending_ops.json watch/alerts.json watch/moves.json watch/paper_trail.json watch/review_queue.json watch/review_queue.md watch/coverage.json watch/side_roles.json watch/safe_activity.json watch/admin_probe.json

      - name: "Trust status per target (watch/trust.json): VERIFIED, PARTIAL, STALE, DISPUTED, UNVERIFIED or UNAVAILABLE with machine-readable reasons, one state per dimension, distinct from the score; written AFTER the addresses are shortened (it copies sentences of the independent reader, which must not carry a signer address) and before the run is signed, so the manifest covers it"
        run: python3 scripts/trust.py --watch watch --data data > watch/trust.txt 2>&1 || { echo "exit code $?" >> watch/trust.txt; cat watch/trust.txt; }
        env:
          HAS_SIGNING_KEY: ${{ secrets.WATCH_SIGNING_KEY != '' }}   # whether a key exists, never the key: this script only says whether the run will be signed

      - name: The watch files keep their published contract (watch/schema)
        run: python3 scripts/validate_schemas.py --watch watch > watch/schemas.txt 2>&1 || { echo "exit code $?" >> watch/schemas.txt; cat watch/schemas.txt; exit 1; }

      - name: "The files agree with each other: the same contracts in every file, the same counts (watch/consistency.txt; a disagreement is a warning in the run, the files stay valid on their own)"
        run: python3 scripts/consistency.py --watch watch > watch/consistency.txt 2>&1 || echo "::warning title=Watch files disagree::$(head -c 700 watch/consistency.txt | tr '\n' ' ')"

      - name: "Age of the last commit on main (GitHub disables scheduled workflows after 60 days without repository activity): written to watch/main_activity.json, one Telegram message at 45, 52 and 58 days, one issue from day 45 when ISSUES_TOKEN is set, never fails the run"
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/main_activity.py --out watch/main_activity.json --issue-repo RealSpap/authority-risk-oracle --subject "${{ github.repository }}" > watch/main_activity.txt 2>&1 || echo "exit code $?" >> watch/main_activity.txt; cat watch/main_activity.txt

      - name: "Nothing left out of the public view may appear in a published file: the feeds and the totals are written without it, then everything is checked (names the folder, never the string; a failure stops the job before the signature, so nothing is recorded)"
        id: heldcheck
        env:
          WATCH_WITHHOLD: ${{ secrets.WATCH_WITHHOLD }}
          WATCH_WITHHOLD_PRIVATE: ${{ runner.temp }}/held_queue.json
        run: |
          python3 scripts/withhold.py views --watch watch > /dev/null 2>&1 || { echo "::error title=Public view::the feeds could not be written without what is left out, so nothing was recorded"; exit 1; }
          python3 scripts/withhold.py check --watch watch 2> watch/withhold.txt || { echo "::error title=Public view::a published file names something that is left out, so nothing was recorded"; exit 1; }

      - name: "Sign the run (a manifest of every published file and the chain head, Ed25519): with WATCH_SIGNING_KEY the files can be checked against a key GitHub does not hold; without it the manifest says unsigned. A failure stops the job here: a state whose signature failed is not recorded (the next run would refuse it, and every run after it)"
        id: sign
        env:
          WATCH_SIGNING_KEY: ${{ secrets.WATCH_SIGNING_KEY }}
        run: |
          python3 scripts/sign_run.py --watch watch > watch/signature.txt 2>&1 || {
            c=$?; echo "exit code $c" >> watch/signature.txt; cat watch/signature.txt; echo "failed=1" >> "$GITHUB_OUTPUT"
            echo "::error title=Signing failed::the run could not be signed, so it is not recorded on watch-data (the next run starts from the last signed state)"; exit 1
          }

      - name: "One health record for the run (watch/status.json: ok / degraded / alarm with the reasons) and the integrity badge"
        run: python3 scripts/run_status.py --watch watch > watch/status.txt 2>&1 || echo "exit code $?" >> watch/status.txt; cat watch/status.txt

      - name: "The files come from the same passage: latest.json, status.json and signature.json carry the same run_id (a step that failed leaves an old file in place)"
        run: python3 scripts/check_run_id.py --watch watch > watch/run_id.txt 2>&1 || echo "exit code $?" >> watch/run_id.txt; cat watch/run_id.txt

      - name: "The run as Prometheus metrics (watch/metrics.prom): a monitor can alert on a stopped Watch, an alarm, a high alert or an oracle not read, without parsing nine files"
        run: python3 scripts/metrics_prom.py --watch watch > watch/metrics.txt 2>&1 || echo "exit code $?" >> watch/metrics.txt; cat watch/metrics.txt

      - name: "A catalogue of what the watch publishes (watch/catalog.json): where each file is, what it holds, which one answers which question"
        run: python3 scripts/catalog.py --watch watch --api watch/API.md > watch/catalog.txt 2>&1 || echo "exit code $?" >> watch/catalog.txt; cat watch/catalog.txt

      - name: "Check: no published file may still name a signer address of the private index (everything under watch/, not only the redaction list). Without the index (the step above failed or timed out) the check is NOT RUN, says so, and the run is published with the strict redaction of the list only"
        run: python3 scripts/redact_signers.py --index "$RUNNER_TEMP/who_controls.json" --scores watch/scores --check watch

      - name: "Alarm gate: a new finding opens an issue, a standing state a reminder once a day, an unchanged one nothing (watch/alarm_state.json)"
        id: gate
        if: always()
        env:
          HAS_TOKEN: ${{ secrets.ISSUES_TOKEN != '' }}
          ALARM_CONDITION: ${{ steps.run.outputs.code != '0' || steps.so.outputs.disagree != '0' || steps.so.outputs.upgraded != '0' || steps.meth.outputs.changed != '0' || steps.rq.outputs.overdue != '0' || steps.rules.outputs.hi_new != '0' || steps.run.outputs.prev_alarm == '1' || steps.sign.outputs.failed == '1' }}   # the same condition as the Alarm step: the gate tells the end of an alarm only when it is false
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then W="--write"; else W=""; fi
          python3 scripts/alarm_gate.py --watch watch --run-log watch/run.log $W | tee -a "$GITHUB_OUTPUT"

      - name: "Alarm cleared: the findings of the last notice are all gone, so the person who was told is told it is over (an issue in the private repository; nothing without ISSUES_TOKEN)"
        if: always() && steps.gate.outputs.mode == 'recovered'   # the state that makes it 'recovered' is only written when ISSUES_TOKEN exists
        continue-on-error: true   # a failed notice (an expired token, the API down) must not stop the run from being recorded on watch-data: this step is before "Record the run"
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          PRIVATE_REPO: RealSpap/authority-risk-oracle
        run: |
          [ -n "$GH_TOKEN" ] || exit 0
          gh label create alarm --repo "$PRIVATE_REPO" --color B60205 --description "A score dropped, a target turned stale or an oracle stopped answering" 2>/dev/null || true
          gh issue create --repo "$PRIVATE_REPO" --title "Alarm cleared $(date -u '+%Y-%m-%d %H:%M') UTC: no finding stands any more" --label alarm --body "The Watch run of $(date -u +%Y-%m-%dT%H:%MZ) found none of the findings of the last alarm. This is the end of that alarm, not a silence: the run files are on the watch-data branch."

      - name: Record the run on the watch-data branch (watch/.gitignore keeps the job logs, *.txt and *.log, out of it; main receives nothing)
        run: |
          bash scripts/watch_branch.sh record "Watch $(date -u +%Y-%m-%dT%H:%MZ): $(head -c 160 watch/run.log | tr -d '\n')"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCH_REMOTE: https://github.com/${{ github.repository }}.git

      - name: Alarm (an issue in the private repository, where the work happens; without ISSUES_TOKEN the alarm stays in this log)
        if: always() && (steps.run.outputs.prev_alarm == '1' || steps.sign.outputs.failed == '1' || ((steps.run.outputs.code == '2' || steps.so.outputs.disagree != '0' || steps.so.outputs.upgraded != '0' || steps.meth.outputs.changed != '0' || steps.rq.outputs.overdue != '0' || steps.rules.outputs.hi_new != '0') && steps.gate.outputs.mode != 'quiet'))   # a refused previous state, the bootstrap switch left on or a failed signature always open an issue: the gate (and the alarm_state.json it reads, which is not signed) cannot make them quiet
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          PRIVATE_REPO: RealSpap/authority-risk-oracle
        run: |
          [ -f watch/alarm.md ] || printf '# Alarm, %s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > watch/alarm.md
          if [ "${{ steps.sign.outputs.failed }}" = 1 ]; then printf '\nThe run could not be signed (watch/signature.txt, printed in the job log). Nothing was recorded on watch-data: the next run starts from the last signed state.\n' >> watch/alarm.md; fi
          if [ "${{ steps.run.outputs.prev_alarm }}" = 1 ] && [ "${{ steps.run.outputs.code }}" != 2 ]; then { printf '\n'; grep '^ALARM' watch/previous_state.txt; } >> watch/alarm.md; fi   # the switch used or left on (a refusal already put its lines at the top of alarm.md)
          [ -f watch/second_opinion.md ] && { printf '\n' >> watch/alarm.md; cat watch/second_opinion.md >> watch/alarm.md; }   # the independent reader's disagreements travel with the alarm
          [ -f watch/methodology.md ] && { printf '\n' >> watch/alarm.md; cat watch/methodology.md >> watch/alarm.md; }   # a methodology change travels with the alarm
          [ -f watch/alerts_high.md ] && { printf '\n' >> watch/alarm.md; cat watch/alerts_high.md >> watch/alarm.md; }   # a new high alert (a drain, a pause, a change ready to execute) travels with the alarm: it needs no Discord or Telegram secret
          [ -f watch/review_queue.md ] && { printf '\n' >> watch/alarm.md; cat watch/review_queue.md >> watch/alarm.md; }   # the whole review queue, with ages: what waits and since when
          [ "$(wc -c < watch/alarm.md)" -gt 60000 ] && { head -c 60000 watch/alarm.md > watch/alarm.tmp && printf '\n\n(cut at 60000 characters, GitHub refuses an issue body over 65536: the files are in watch/ and the job log)\n' >> watch/alarm.tmp && mv watch/alarm.tmp watch/alarm.md; }   # a long day (every target stale + the whole review queue) must not lose the alarm
          [ -n "$GH_TOKEN" ] || { echo "::warning::alarm raised but no ISSUES_TOKEN secret: no issue opened (alarm.md is printed below)"; cat watch/alarm.md; exit 0; }
          gh label create alarm --repo "$PRIVATE_REPO" --color B60205 --description "A score dropped, a target turned stale or an oracle stopped answering" 2>/dev/null || true
          gh label create escalation --repo "$PRIVATE_REPO" --color 5B0000 --description "The same alarm state has stood for 72 hours or more" 2>/dev/null || true
          gh issue create --repo "$PRIVATE_REPO" --title "Alarm$([ "${{ steps.gate.outputs.mode }}" = reminder ] && printf ' reminder (the state below has not changed for a day)')$([ "${{ steps.gate.outputs.mode }}" = escalation ] && printf ' ESCALATION (the state below has stood for 3 days or more)') $(date -u '+%Y-%m-%d %H:%M') UTC: $(( $(grep -c ALARM watch/run.log) + ${{ steps.so.outputs.disagree || 0 }} + ${{ steps.so.outputs.upgraded || 0 }} + ${{ steps.meth.outputs.changed || 0 }} + ${{ steps.rq.outputs.overdue || 0 }} + ${{ steps.rules.outputs.hi_new || 0 }} )) finding(s) on the deployed oracles" \
            --label "alarm$([ "${{ steps.gate.outputs.mode }}" = escalation ] && printf ',escalation')" --body-file watch/alarm.md

      - name: "Escalation: the same alarm state has stood for 72 hours or more, so the alert channels (Discord, the signed webhook, Telegram), which the alarm does not use, get one short message: counts and kinds only, nothing private"
        if: always() && steps.gate.outputs.mode == 'escalation'
        continue-on-error: true   # a channel that is down must not stop the run from being recorded
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_WEBHOOK_SECRET: ${{ secrets.ALERT_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/escalate.py --watch watch

      - name: "Daily report (first run of the day, about 20 minutes): stale oracles, Safe changes, queued operations, code changes"
        id: digest
        run: |
          today=$(date -u +%F)
          # the first run of the UTC day that reaches this step makes the report, at any hour: no report dated today AND no attempt marked today; a run started by hand forces it; a script does not: a person is a run whose relay input is empty or exactly false, any other value is a script
          first=0; if ! grep -q "^# Authority risk digest, $today " watch/digest.md 2>/dev/null && [ "$(cat watch/.digest_attempt 2>/dev/null)" != "$today" ]; then first=1; fi
          if [ "$first" = 1 ] || { [ "$EVENT_NAME" = workflow_dispatch ] && { [ -z "$RELAY" ] || [ "$RELAY" = false ]; }; }; then
            echo "$today" > watch/.digest_attempt   # the mark of the attempt, written BEFORE it: a report that fails (exit code, 124, redaction, re-signature, record) is not tried again by every later run of the day
            bash scripts/watch_branch.sh record "Daily report attempt $today" || { echo "::error title=Daily report::the mark of the attempt could not be recorded on the branch: the report is not attempted by this run"; exit 1; }   # recorded ALONE, before the attempt: here watch/ is the state the run already signed and recorded plus this one line (not in the signed manifest), so nothing unsigned is published; whatever stops the step later, one attempt a UTC day, never one per run
            timeout 35m python3 scripts/daily_digest.py --days 7 --out watch/digest.md --queue watch/review_queue.md > watch/digest.log 2>&1 || { c=$?; if [ "$c" = 124 ]; then echo "timed out at the step limit (124), previous file kept, a warning" >> watch/digest.log; else echo "exit code $c" >> watch/digest.log; fi; }
            python3 scripts/redact_signers.py --index "$RUNNER_TEMP/who_controls.json" --scores watch/scores watch/digest.md
            python3 scripts/redact_signers.py --index "$RUNNER_TEMP/who_controls.json" --scores watch/scores --check watch   # the guard again, before the commit: the report must not publish a signer
            python3 scripts/sign_run.py --watch watch > watch/signature.txt 2>&1 || { echo "exit code $?" >> watch/signature.txt; echo "::error title=Re-signing failed::the digest changed a published file and the manifest could not be signed again: the report is not recorded (the state on watch-data stays the one the run signed)"; exit 1; }   # the report changed a published file: sign again so the manifest matches what is committed; a failure ends the step BEFORE the record (recording it would leave a state the next run refuses)
            bash scripts/watch_branch.sh record "Daily report $(date -u +%Y-%m-%d)"
            if [ "$first" = 1 ]; then echo "first=1" >> "$GITHUB_OUTPUT"; fi   # written AFTER the record: the Monday summary below goes out only with the run that made (and published) the day's report; a step that stopped before the report was recorded leaves no output (no Monday summary that day) and the mark stays published: no second attempt that day
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCH_REMOTE: https://github.com/${{ github.repository }}.git
          WATCH_SIGNING_KEY: ${{ secrets.WATCH_SIGNING_KEY }}   # by env, never written into the script text
          EVENT_NAME: ${{ github.event_name }}   # by env as well: a workflow input is never pasted into the shell
          RELAY: ${{ inputs.relay }}

      - name: Daily summary on Telegram (only when the repository variable TELEGRAM_MODE is "daily"; first run of the day; nothing is sent without the two secrets)
        if: always() && vars.TELEGRAM_MODE == 'daily'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # prepared 12/10 (not active until the variable is set): one message a day, counted by kind, no protocol and no detail (scripts/telegram_digest.py --daily)
          if [ "$(date -u +%H)" -lt 6 ]; then
            python3 scripts/telegram_digest.py --watch watch --daily || echo "::warning title=Daily Telegram summary::not sent (see the line above)"
          fi

      - name: Weekly summary on Telegram (Monday, with the first run of the UTC day that made the day's report, once; nothing is sent without the two secrets; replaced by the daily summary when TELEGRAM_MODE is "daily")
        if: always() && vars.TELEGRAM_MODE != 'daily' && steps.digest.outputs.first == '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # the channel only speaks on an alarm, so a quiet week looked like a dead channel: once a week it says what the watch did (scripts/telegram_digest.py, built from the published files only)
          if [ "$(date -u +%u)" = 1 ]; then
            python3 scripts/telegram_digest.py --watch watch || echo "::warning title=Weekly Telegram summary::not sent (see the line above)"
          fi

      - name: "Telegram (only if the secrets are set, and not in daily mode, because the full alarm text names protocols and findings that the public channel no longer carries when TELEGRAM_MODE is daily)"
        if: always() && steps.run.outputs.code == '2' && vars.TELEGRAM_MODE != 'daily'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'scripts/lib'); import alerts
          t = open('watch/alarm.md').read()
          # Telegram refuses a message over 4096 characters and send_telegram_alert swallows the error: the alarm (12 KB with the independent reader's findings and the review queue) was never delivered
          alerts.send_telegram_alert(t if len(t) <= 4000 else t[:3900] + "\n... (cut at the Telegram limit of 4096 characters, the full text is in the private issue and the job log)")
          PY

      - name: "Private alarm when the public view could not be written as intended (a check that failed, a step that stopped with a list present, a list that was not read): one issue a day in the private repository, nothing named"
        if: always()
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          PRIVATE_REPO: RealSpap/authority-risk-oracle
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          W_ALARM: ${{ steps.withhold.outputs.alarm }}
          W_OUTCOME: ${{ steps.withhold.outcome }}
          C_OUTCOME: ${{ steps.heldcheck.outcome }}
        run: |
          grep -q '^ALARM withhold' watch/run.log 2>/dev/null || [ "$W_ALARM" = 1 ] || [ "$W_OUTCOME" = failure ] || [ "$C_OUTCOME" = failure ] || exit 0
          [ -n "$GH_TOKEN" ] || { echo "::warning::the public view could not be written as intended, and no ISSUES_TOKEN secret: no private issue opened"; exit 0; }
          open=$(gh issue list --repo "$PRIVATE_REPO" --label public-view-alarm --state open --json number,createdAt --jq '[.[] | select((.createdAt | fromdateiso8601) > (now - 72000))] | length' 2>/dev/null || echo 0)
          [ "${open:-0}" = 0 ] || exit 0
          { printf 'The public view of the Watch could not be written as intended in this run (%s).\n\n' "$RUN_URL"; grep '^ALARM withhold' watch/run.log 2>/dev/null | head -5; printf '\nNothing is named here: read the job log, then the private issue "Entries not shown in the public view".\n'; } > "$RUNNER_TEMP/public_view_alarm.md"
          gh label create public-view-alarm --repo "$PRIVATE_REPO" --color B60205 --description "The public view of the Watch could not be written as intended" > /dev/null 2>&1 || true
          gh issue create --repo "$PRIVATE_REPO" --title "Public view alarm $(date -u '+%Y-%m-%d %H:%M') UTC" --label public-view-alarm --body-file "$RUNNER_TEMP/public_view_alarm.md" > /dev/null 2>&1 || true

      - name: "Red if any step failed (the logs are printed here, not committed)"
        if: always()
        run: |
          { cat watch/run.log watch/freshness.txt 2>/dev/null; grep -H 'exit code' watch/*.txt watch/*.log 2>/dev/null; } | sed 's/^/  /' || true   # never digest.log or safe_changes.log here: they hold text from before the redaction, and Actions logs of a public repository are public
          if grep -lq 'exit code' watch/*.txt watch/*.log 2>/dev/null; then echo "::error::a step failed, see the logs above"; exit 1; fi

      - name: "Failure report: a failed run opens one issue in the repository named by the variable ALERT_REPO, never in this repository"
        # Plan 12.4, row 1: the cause of the failures since 4 Nov is unread. This step does not correct anything: it makes each failed run reach a private place with its link, so the cause is read from the run itself.
        # Target: the repository variable ALERT_REPO (owner/name, set by the owner). Empty, unreadable or equal to this repository: no issue, a warning in the job summary, the step ends green. The token is the existing secret ISSUES_TOKEN (the alarm steps use it); nothing is written here.
        # The issue holds the workflow name, the UTC time, the link of the run and the number of the last failed step: no name, no address, no data of the oracles. One issue per run (the run id is in the title).
        # Limit, not checked on GitHub: a job stopped by its time limit may not run this step.
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          READ_TOKEN: ${{ github.token }}   # read-only use: the list of steps of this run (permission actions: read)
          ALERT_REPO: ${{ vars.ALERT_REPO }}
          THIS_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          S="${GITHUB_STEP_SUMMARY:-/dev/null}"
          skip() { echo "::warning title=Failure report::$1"; printf '### Failure report not sent\n\n%s\n' "$1" >> "$S"; exit 0; }
          [ -n "$ALERT_REPO" ] || skip "the repository variable ALERT_REPO is empty: no issue was opened (this run failed, read its log)."
          printf '%s' "$ALERT_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || skip "ALERT_REPO is not of the form owner/name: no issue was opened."
          [ "$(printf '%s' "$ALERT_REPO" | tr 'A-Z' 'a-z')" != "$(printf '%s' "$THIS_REPO" | tr 'A-Z' 'a-z')" ] || skip "ALERT_REPO is this repository: no issue is opened here, the repository is public."
          [ -n "$GH_TOKEN" ] || skip "no ISSUES_TOKEN secret: no issue was opened."
          n=$(GH_TOKEN="$READ_TOKEN" gh api "repos/$THIS_REPO/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.name == "watch") | .steps[] | select(.conclusion == "failure") | select(.name | startswith("Red if any step failed") | not)] | last | .number // empty' 2>/dev/null || true)
          case "$n" in ''|*[!0-9]*) last="none other than the final check step (a step wrote its failure into its file)";; *) last="step number $n of the job";; esac
          dup=$(gh issue list --repo "$ALERT_REPO" --label watch-failure --state all --search "run $RUN_ID in:title" --json number --jq 'length' 2>/dev/null || echo 0)
          [ "${dup:-0}" = 0 ] || { echo "an issue for this run already exists"; exit 0; }
          { printf 'Workflow: %s\nTime: %s UTC\nRun: %s\nLast failed step: %s\n\nNothing else is written here: read the log of the run.\n' "$WORKFLOW_NAME" "$(date -u '+%Y-%m-%d %H:%M')" "$RUN_URL" "$last"; } > "$RUNNER_TEMP/failure_report.md"
          gh label create watch-failure --repo "$ALERT_REPO" --color B60205 --description "A Watch run failed" > /dev/null 2>&1 || true
          gh issue create --repo "$ALERT_REPO" --title "Watch run failed $(date -u '+%Y-%m-%d %H:%M') UTC, run $RUN_ID" --label watch-failure --body-file "$RUNNER_TEMP/failure_report.md" > /dev/null 2>&1 || skip "the issue could not be opened in ALERT_REPO (token or permission): read the log of the run."
