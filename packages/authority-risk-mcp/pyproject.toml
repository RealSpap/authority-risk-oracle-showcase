[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authority-risk-mcp"
version = "0.1.0"
description = "Read-only MCP server: who can change a smart contract, how fast, and how strong the setup is. Reads the signed files of the Authority Risk Oracle Watch."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "RealSpap" }]
keywords = ["mcp", "model-context-protocol", "smart-contracts", "security", "defi", "admin-keys", "multisig", "timelock", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/RealSpap/authority-risk-oracle-showcase"
Source = "https://github.com/RealSpap/authority-risk-oracle-showcase/tree/main/packages/authority-risk-mcp"
Issues = "https://github.com/RealSpap/authority-risk-oracle-showcase/issues"

[project.scripts]
authority-risk-mcp = "authority_risk_mcp.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authority_risk_mcp = ["_vendor/*.py"]
